name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # Includes the banned-api rule that keeps Postgres-only SQL out of app code.
      - run: ruff check .

  test-sqlite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the dev machine's reality; 3.12 is what containers run.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # MERGE GATE 1. SQLite is a fast local proxy; this is the authority.
  test-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: csaas
          POSTGRES_PASSWORD: csaas
          POSTGRES_DB: csaas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://csaas:csaas@localhost:5432/csaas_test
      TEST_DATABASE_URL: postgresql+asyncpg://csaas:csaas@localhost:5432/csaas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # This step is what actually tests the migrations — locally we never run
      # Alembic against SQLite.
      - run: alembic upgrade head
      - run: alembic downgrade base
      - run: alembic upgrade head
      # Full suite including pg_only tests.
      # Job logs need admin rights to download via the API even on a public repo, so the
      # failure summary is re-emitted as workflow annotations, which ARE readable.
      - name: Run tests
        run: |
          set -o pipefail
          pytest -q -rf --tb=short 2>&1 | tee /tmp/pytest.txt || {
            echo "::group::pytest failure summary"
            tail -c 8000 /tmp/pytest.txt
            echo "::endgroup::"
            grep -E "^(FAILED|ERROR)" /tmp/pytest.txt | head -20 | while read -r line; do
              echo "::error title=pytest::$line"
            done
            sed -n '/=== FAILURES ===/,$p' /tmp/pytest.txt | grep -E "^E " | head -20 |               while read -r line; do echo "::error title=assertion::$line"; done
            exit 1
          }

  # MERGE GATE 2. Until Playwright arrives (P6) these checks plus the backend contract
  # tests are what stand in for a browser E2E layer.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend (needed to regenerate the OpenAPI schema)
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      # OPENAPI DRIFT GATE: regenerate the schema and the generated types from the live
      # FastAPI app and fail if either differs from what is committed. The frontend
      # cannot silently disagree with the backend about a response shape.
      - name: Regenerate API types
        working-directory: frontend
        run: npm run gen:api

      - name: Fail on API drift
        run: git diff --exit-code frontend/openapi.json frontend/src/api/types.gen.ts

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: frontend
        run: npx vitest --run

      - name: Production build
        working-directory: frontend
        run: npx vite build
