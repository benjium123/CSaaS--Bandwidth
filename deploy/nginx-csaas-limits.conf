# D4: HTTP-context rate-limit zone for csaas's login/2FA/register endpoints.
# Install to /etc/nginx/conf.d/csaas-limits.conf BEFORE enabling deploy/nginx-csaas.conf
# (that site file's `limit_req zone=csaas_auth ...` lines fail `nginx -t` otherwise) -
# see docs/RUNBOOK.md for the install order and verification steps.
limit_req_zone $binary_remote_addr zone=csaas_auth:10m rate=5r/m;

# P43 (audit): the public "report a suspicious number" page is unauthenticated and writes a
# row, so it needs a ceiling that does not depend on the app's own limiter - which, with no
# Redis configured, is per WORKER and therefore multiplied by the worker count. Looser than
# csaas_auth because a person reporting several numbers is normal behaviour.
limit_req_zone $binary_remote_addr zone=csaas_public:10m rate=30r/m;
