# ------------------------------------------------------------------
# STAGED CONFIGURATION - NOT YET ACTIVE
#
# Plain HTTP listener used only to serve ACME HTTP-01 challenges
# from /var/www/html. It intentionally contains no TLS directives
# and no redirects; the HTTPS site is staged separately and must
# not be activated until certificates are installed.
# ------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name ringlite.io;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 503;
    }
}
