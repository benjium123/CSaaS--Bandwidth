# CSaaS — nginx site file. REFERENCE ONLY; installing it is P1b and operator-run.
#
# THE BOX RUNS LIVE PRODUCTION SERVICES FOR OTHER BUSINESSES.
#   - This is a SELF-CONTAINED site file. Do not edit nginx.conf itself.
#   - It exposes exactly TWO paths: the Bandwidth messaging webhook, and /healthz.
#     The rest of the API stays unreachable from the internet until P2 needs it.
#   - Install as /etc/nginx/sites-available/csaas, symlink into sites-enabled,
#     `nginx -t` BEFORE `systemctl reload nginx`, and check no other site already
#     claims this server_name.
#
# Certificate: certbot --nginx -d <your-host>

server {
    listen 80;
    server_name CHANGE_ME.example.com;

    # ACME challenge must stay on :80; everything else goes to TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name CHANGE_ME.example.com;

    ssl_certificate     /etc/letsencrypt/live/CHANGE_ME.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CHANGE_ME.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Bandwidth posts JSON arrays; they are small. Cap the body to blunt abuse.
    client_max_body_size 256k;

    access_log /var/log/nginx/csaas.access.log;
    error_log  /var/log/nginx/csaas.error.log;

    # --- the ONLY publicly exposed application path in P1b ---------------------
    location = /api/v1/webhooks/bandwidth/messaging {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Bandwidth expects a fast ack. Fail fast rather than holding their connection.
        proxy_connect_timeout 2s;
        proxy_read_timeout    10s;

        # NOTE: the app itself verifies Bandwidth's HTTP Basic credentials in
        # constant time. Do NOT add an nginx auth_basic here — it would reject the
        # carrier before our handler ever sees the event.
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # --- P2b: the console + the full API -----------------------------------
    # This WIDENS exposure from P1b's webhook-only surface to the whole API, which is
    # exactly why 2FA ships in P2 and not later.
    # WebSocket event stream (P6 softphone ring push). Needs the Upgrade headers the
    # plain /api/ block deliberately lacks, and a read timeout comfortably above the
    # app's 25s keepalive ping. NOTE: access_log off here - the auth JWT travels as a
    # query parameter (browsers cannot set WS headers) and must not land in logs.
    location = /api/v1/events/ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 300s;
        access_log off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Static console. Built LOCALLY (node is a dev-machine tool, never installed on this
    # box) and shipped inside the deploy archive.
    root /opt/csaas/frontend/dist;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;   # SPA fallback
    }
}
