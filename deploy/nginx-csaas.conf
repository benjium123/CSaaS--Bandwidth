# CSaaS — nginx site file. REFERENCE ONLY; installing it is P1b and operator-run.
#
# THE BOX RUNS LIVE PRODUCTION SERVICES FOR OTHER BUSINESSES.
#   - This is a SELF-CONTAINED site file. Do not edit nginx.conf itself.
#   - It exposes exactly TWO paths: the Bandwidth messaging webhook, and /healthz.
#     The rest of the API stays unreachable from the internet until P2 needs it.
#   - Install as /etc/nginx/sites-available/csaas, symlink into sites-enabled,
#     `nginx -t` BEFORE `systemctl reload nginx`, and check no other site already
#     claims this server_name.
#
# Certificate: certbot --nginx -d <your-host>
#
# ------------------------------------------------------------------------------------
# D4/8.3: rate-limit zone for login/TOTP/register. `limit_req_zone` is an HTTP-CONTEXT
# directive - it CANNOT live inside this file's `server {}` blocks (a commented-out copy
# used to sit here as a "paste this into nginx.conf" reminder; nginx -t fails on
# `limit_req zone=csaas_auth` below with no error pointing at the real cause if that step
# is skipped). It now lives in deploy/nginx-csaas-limits.conf, which MUST be installed to
# /etc/nginx/conf.d/csaas-limits.conf BEFORE this site file is enabled - see
# docs/RUNBOOK.md. conf.d/*.conf is included from nginx.conf's top-level http{} block on
# stock nginx installs, evaluated ONCE for the whole instance, NOT per site. This box is
# shared with other tenants' nginx sites, so check no other site already defines a zone
# named `csaas_auth` before installing it.
# ------------------------------------------------------------------------------------

server {
    listen 80;
    server_name CHANGE_ME.example.com;

    # ACME challenge must stay on :80; everything else goes to TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name CHANGE_ME.example.com;

    ssl_certificate     /etc/letsencrypt/live/CHANGE_ME.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CHANGE_ME.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 8.10: baseline security headers. `always` so they are also sent on error responses
    # (4xx/5xx), not just 2xx. Live nginx edit = operator, same as everything else here.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/csaas.access.log;
    error_log  /var/log/nginx/csaas.error.log;

    # --- the ONLY publicly exposed application path in P1b ---------------------
    location = /api/v1/webhooks/bandwidth/messaging {
        # 8.2: moved off the server-wide default. Bandwidth posts small JSON arrays, but
        # this is the one path that also carries MMS media payloads.
        client_max_body_size 256k;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Bandwidth expects a fast ack. Fail fast rather than holding their connection.
        proxy_connect_timeout 2s;
        proxy_read_timeout    10s;

        # NOTE: the app itself verifies Bandwidth's HTTP Basic credentials in
        # constant time. Do NOT add an nginx auth_basic here — it would reject the
        # carrier before our handler ever sees the event.
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # 8.3: exact-match login route, rate-limited via the csaas_auth zone declared at the
    # top of this file (which MUST be moved into the http{} block - see the note above).
    # burst=10 nodelay: allow a short burst (e.g. a user mistyping a password a few times
    # in a row) to pass immediately, then settle to the steady 5r/m ceiling.
    location = /api/v1/auth/login {
        limit_req zone=csaas_auth burst=10 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # D7: same brute-force exposure as /login (TOTP guesses, account-creation abuse) -
    # same zone, same burst allowance, same proxy_* lines.
    location ^~ /api/v1/auth/2fa/ {
        limit_req zone=csaas_auth burst=10 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /api/v1/auth/register {
        limit_req zone=csaas_auth burst=10 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # --- P2b: the console + the full API -----------------------------------
    # This WIDENS exposure from P1b's webhook-only surface to the whole API, which is
    # exactly why 2FA ships in P2 and not later.
    # WebSocket event stream (P6 softphone ring push). Needs the Upgrade headers the
    # plain /api/ block deliberately lacks, and a read timeout comfortably above the
    # app's 25s keepalive ping. NOTE: access_log off here - the auth JWT travels as a
    # query parameter (browsers cannot set WS headers) and must not land in logs.
    location = /api/v1/events/ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 300s;
        access_log off;
    }

    location /api/ {
        # 8.2/D9: list/CSV import (IMPORT_MAX_FILE_MB=50 in .env.example) needs real
        # headroom; the old server-wide 256k default 413'd every import and MMS upload.
        # Must match IMPORT_MAX_FILE_MB, not just exceed the old 256k default - a 20m
        # cap here still 413s a file the app itself would accept.
        client_max_body_size 50m;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Static console. Built LOCALLY (node is a dev-machine tool, never installed on this
    # box) and shipped inside the deploy archive.
    root /opt/csaas/frontend/dist;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # D8: nginx's add_header is replace-not-merge per context - this block's own
        # add_header calls above silently drop the server-level security headers (8.10)
        # for every response under /assets/ unless repeated here.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;   # SPA fallback
    }
}
