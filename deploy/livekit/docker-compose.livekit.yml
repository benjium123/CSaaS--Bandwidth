# LiveKit media plane (D17): SFU + SIP bridge for the softphone (P6) and the AI agent (P7+).
#
# D16: this file MUST be passed to `docker compose -f ... -f ...` AFTER
# deploy/docker-compose.prod.yml, in that order - Compose resolves bind-mount paths that
# are relative (./livekit/livekit.yaml, ./livekit/sip.yaml, below) against the FIRST -f
# file's directory (deploy/), not this file's own directory (deploy/livekit/). Passed
# alone, or first, those relative paths resolve to deploy/livekit/livekit/livekit.yaml,
# which doesn't exist - compose creates it as an empty directory and livekit fails to
# find its config.
#
# Run TOGETHER with the main stack, main stack FIRST:
#   docker compose -f deploy/docker-compose.prod.yml -f deploy/livekit/docker-compose.livekit.yml up -d
#
# UNLIKE the api/db services, the media plane MUST bind public interfaces: Telnyx has to
# reach SIP signaling (5060/udp) and the SFU has to reach browsers over UDP. Every port
# here is chosen to avoid the other tenants on this VPS; the RTP range is deliberately
# narrow (500 ports) because this box shares CPU with other businesses.
#
# Firewall (ufw) additions required:
#   7881/tcp   ICE/TCP fallback
#   50700-51199/udp  WebRTC RTP
#   5060/udp   SIP signaling (restrict to Telnyx signaling IPs in ufw where possible)
#   10000-10499/udp  SIP RTP
#
# `livekit` runs with network_mode: host (addendum to 8.16 - the 500-port UDP RTP range
# was previously published one-by-one through docker-proxy, a userspace process PER
# port; host networking removes that entirely). One consequence: docker can no longer
# restrict 7880 (signal/API) to loopback via a port-publish mapping the way
# "127.0.0.1:7880:7880" used to - livekit.yaml's `bind_addresses: [""]` now means 7880
# listens on every interface the HOST has, including its public IP, unless ufw blocks
# it. REQUIRED operator step this trades in for the docker-proxy fix:
#   ufw deny in on <public-iface> to any port 7880 proto tcp
# (nginx's own proxy_pass traffic arrives via 127.0.0.1 and is unaffected by a deny rule
# scoped to the public interface). Do this BEFORE bringing `livekit` up with this file.
name: csaas

# 8.6: same bounded JSON logging as the main stack (deploy/docker-compose.prod.yml) -
# these services are just as capable of filling the disk with unrotated logs.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  livekit:
    image: livekit/livekit-server:v1.8
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      # Path is relative to the FIRST -f file's directory (deploy/), per compose
      # multi-file resolution — NOT this file's directory.
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    environment:
      # Key id is the FIXED string "csaas-media"; only the secret is secret.
      LIVEKIT_KEYS: "csaas-media: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}"
    # network_mode: host (addendum to 8.16): avoids one docker-proxy userspace process
    # PER UDP port across the 500-wide RTP range - the same reasoning livekit-sip below
    # already uses, and for the same one-way-audio-via-bridge-NAT reason. `ports:` is
    # meaningless under host networking (livekit.yaml's own bind_addresses/port_range
    # settings are what actually control what's listened on) - see the ufw note above
    # for what this now requires at the firewall instead of docker's port-publish.
    network_mode: host
    depends_on:
      - redis
    logging: *default-logging

  livekit-sip:
    image: livekit/sip:v1.8
    restart: unless-stopped
    command: --config /etc/sip.yaml
    volumes:
      - ./livekit/sip.yaml:/etc/sip.yaml:ro
    environment:
      LIVEKIT_API_KEY: csaas-media
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
    network_mode: host   # SIP + RTP need the real host address in SDP; NAT rewriting inside
                         # docker bridge networks is exactly the one-way-audio machine.
    logging: *default-logging
