# Full dependency lock (8.23). D12: the original freeze came from a Windows .venv, which
# is wrong for this Dockerfile (python:3.12-slim/Linux) in two ways - uvloop is
# conditionally excluded by uvicorn[standard]'s Windows marker (sys_platform != 'win32'),
# so it never showed up in a Windows `pip freeze` despite always installing in the Linux
# container; and colorama (a Windows-console-only shim pytest/click pull in) has no
# business in the lock at all. Also strips dev/test-only tooling (pytest, pytest-asyncio,
# pytest-cov, coverage, mypy, ruff) that the prod image never runs, to keep the image
# smaller and the lock scoped to what actually ships.
#
# Correct regen procedure (needs Docker): build the image, then freeze *inside* it -
#   docker compose -f deploy/docker-compose.prod.yml build api
#   docker compose -f deploy/docker-compose.prod.yml run --rm --no-deps api \
#       pip freeze > backend/requirements.lock
# then re-add this header comment (pip freeze overwrites it) and re-strip the dev/test
# packages pulled in by `pip install -e .[dev]` if that's how the image was built.
#
# uvloop==0.22.1 below was hand-added (Docker was unavailable when this fix was made) -
# it is the newest release satisfying uvicorn[standard]'s `uvloop>=0.15.1` marker as of
# 2026-09-04 (checked via `pip index versions uvloop`). Verify against a real
# `pip freeze` inside the Linux image next time Docker is available, in case a newer
# uvloop has shipped since.
