[project]
name = "csaas"
version = "0.1.0"
description = "CSaaS - Communications Software as a Solution"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "structlog>=24.4",
    "PyJWT>=2.9",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "python-multipart>=0.0.17",
    "phonenumbers>=8.13",
    "pyotp>=2.9",
    # zoneinfo has no tz database on Windows or slim containers; without this,
    # ZoneInfo("America/Chicago") raises and quiet hours cannot be evaluated.
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["."]
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "TID"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the framework idiom

# GUARD 2 (phase-0-plan DR-1): Postgres-only SQL must never hide in app code,
# because the local SQLite suite would not catch it.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sqlalchemy.dialects.postgresql".msg = "Postgres-only dialect is allowed ONLY in app/db/types.py and migrations/. Use the portable types in app.db.types."

[tool.ruff.lint.per-file-ignores]
"app/db/types.py" = ["TID251"]
"migrations/*" = ["TID251"]
"tests/*" = ["TID251"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "pg_only: test requires real PostgreSQL semantics; skipped on the SQLite backend",
    "live_carrier: test hits a REAL carrier; skipped unless BANDWIDTH_LIVE_TEST=1 with real creds",
]
filterwarnings = ["ignore::DeprecationWarning"]
